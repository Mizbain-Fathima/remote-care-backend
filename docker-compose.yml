version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: voucher
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

  jaeger:
    image: jaegertracing/all-in-one:1.63
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      GRPC_PORT: ":50051"
      HTTP_PORT: ":8080"
      POSTGRES_URL: "postgres://postgres:postgres@db:5432/voucher?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      RABBIT_URL: "amqp://guest:guest@rabbitmq:5672/"
      SERVICE_NAME: "voucher-payment-service"
    depends_on:
      - db
      - redis
      - rabbitmq
      - jaeger
    ports:
      - "8080:8080"
      - "50051:50051"

volumes:
  db_data:
  redis_data:
